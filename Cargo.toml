[package]
name = "rdh-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[workspace]
members = ["xtask"]
resolver = "3"

[workspace.package]
version = "0.9.0-rc.3"
edition = "2024"
rust-version = "1.93"
license = "Apache-2.0"

[profile.release]
lto = "thin"
strip = "debuginfo"

[[bin]]
name = "rdh"
path = "src/main.rs"

[features]
default = ["experimental-windows-install", "experimental-macos-install"]
# Windows platform backends.
experimental-windows-install = ["experimental-windows-processes", "experimental-windows-startup", "experimental-windows-audit"]
# macOS platform backends.
experimental-macos-install = ["experimental-macos-files", "experimental-macos-processes", "experimental-macos-startup", "experimental-macos-audit"]
# Windows task/service registration and administrator grants.
experimental-windows-startup = ["experimental-windows-processes", "experimental-windows-private-storage", "dep:windows"]
# Windows Job Object process supervision and pipe handling.
experimental-windows-processes = ["experimental-windows-files"]
# Windows handle-relative file operations.
experimental-windows-files = []
# Windows private storage, ACL validation and profile locking.
experimental-windows-private-storage = []
# Windows private audit files, rotation and recovery.
experimental-windows-audit = ["experimental-windows-private-storage"]
# macOS audit file synchronization and rotation.
experimental-macos-audit = []
# macOS launchd registration and local approval.
experimental-macos-startup = []
# macOS descriptor-relative file operations.
experimental-macos-files = []
# macOS process-group observation and cleanup.
experimental-macos-processes = ["experimental-macos-files"]

[dependencies]
base64 = "0.22"
futures-util = { version = "0.3", features = ["sink"] }
hmac = "0.12"
hyper-util = { version = "0.1", features = ["client-proxy"] }
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal", "process"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "rustls-tls-native-roots"] }
url = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", optional = true, features = ["Win32_Foundation", "Win32_Security", "Win32_System_Com", "Win32_System_TaskScheduler", "Win32_System_Ole", "Win32_System_Variant"] }
windows-sys = { version = "0.61", features = [
    "Wdk_Foundation",
    "Wdk_Storage_FileSystem",
    "Wdk_System_SystemServices",
    "Win32_Foundation",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_EventLog",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_Services",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
] }

[dev-dependencies]
axum = { version = "0.8", features = ["ws"] }
