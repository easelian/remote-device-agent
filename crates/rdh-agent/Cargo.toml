[package]
name = "rdh-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "rdh"
path = "src/main.rs"

[features]
# Requires native Mach-O, installation exclusion, pointer recovery and upgrade checks.
experimental-macos-install = ["experimental-macos-files", "experimental-macos-processes", "experimental-macos-startup", "experimental-macos-audit"]
# Requires native task/service registration and administrator grant validation.
experimental-windows-startup = ["experimental-windows-processes", "experimental-windows-private-storage", "dep:windows"]
# Requires native Job Object, pipe, inheritance, tree cleanup and session checks.
experimental-windows-processes = ["experimental-windows-files"]
# Requires native device-file, directory, atomic mutation and legacy comparison checks.
experimental-windows-files = []
# Requires native Windows ACL, path, and lock interoperability validation.
experimental-windows-private-storage = []
# Requires native audit ACL, rotation, recovery, and legacy handoff validation.
experimental-windows-audit = ["experimental-windows-private-storage"]
# Requires native macOS filesystem, synchronization and audit handoff validation.
experimental-macos-audit = []
# Requires native launchd, filesystem and local approval validation.
experimental-macos-startup = []
# Requires native path, filesystem mutation and old-Agent comparison validation.
experimental-macos-files = []
# Requires native process-group observation, pipe, reap and shutdown validation.
experimental-macos-processes = ["experimental-macos-files"]

[dependencies]
base64 = "0.22"
futures-util = { version = "0.3", features = ["sink"] }
hmac = "0.12"
hyper-util = { version = "0.1", features = ["client-proxy"] }
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal", "process"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "rustls-tls-native-roots"] }
url = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", optional = true, features = ["Win32_Foundation", "Win32_Security", "Win32_System_Com", "Win32_System_TaskScheduler", "Win32_System_Ole", "Win32_System_Variant"] }
windows-sys = { version = "0.61", features = [
    "Wdk_Foundation",
    "Wdk_Storage_FileSystem",
    "Wdk_System_SystemServices",
    "Win32_Foundation",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_EventLog",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_Services",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
] }

[dev-dependencies]
axum = { version = "0.8", features = ["ws"] }
