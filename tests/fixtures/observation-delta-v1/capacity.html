<!doctype html><meta charset="utf-8"><link rel="icon" href="data:,"><title>Capacity</title>
<style>input{display:block;width:600px;height:24px}</style>
<script>
window.capacity = (tail, ascii, titleAscii) => {
  document.title = '🦀'.repeat(4096-titleAscii) + 'x'.repeat(titleAscii);
  const nodes = document.querySelectorAll('input');
  for (let index=0; index<7; index++) nodes[index].value='🦀'.repeat(4095);
  nodes[7].value='🦀'.repeat(tail)+'x'.repeat(ascii);
};
addEventListener('DOMContentLoaded', () => {
  for (let index=0;index<8;index++) {
    const node=document.createElement('input'); node.setAttribute('aria-label','a'); document.body.append(node);
  }
  capacity(0,0,0); window.deltaReady=true;
});
</script>
