<!doctype html><meta charset="utf-8"><link rel="icon" href="data:,"><title>Delta corpus</title>
<style>body{font:14px sans-serif;margin:0}input{width:140px}iframe{width:100%;height:320px;border:0}</style>
<div id="content"></div><script>
const settings = new URLSearchParams(location.search);
const sequence = Number(settings.get('sequence'));
const child = settings.has('child');
const rows = 40;
const framed = sequence % 5 === 4;
const start = framed && child ? Math.floor(rows/2) : 0;
const end = framed && !child ? Math.floor(rows/2) : rows;
const kind = sequence % 5;
const fragment = document.createDocumentFragment();
const root = document.createElement(kind === 1 ? 'table' : 'ul');
for (let index = start; index < end; index++) {
  const record = document.createElement(kind === 1 ? 'tr' : kind === 3 ? 'article' : 'li');
  record.dataset.entry = String(index);
  const body = kind === 1 ? record.appendChild(document.createElement('td')) : record;
  const input = body.appendChild(document.createElement('input'));
  input.setAttribute('aria-label', `Entry ${index} A\u00a0B é e\u0301 🦀`);
  input.value = `value ${index}`;
  if (kind === 2) { input.type = 'checkbox'; input.setAttribute('aria-label', `Check ${index}`); }
  if (kind === 3 && index % 4 === 0) { const text = body.appendChild(document.createElement('span')); text.textContent = ` record ${index}`; }
  root.append(record);
}
if (kind === 0) { const form = document.createElement('form'); form.append(root); fragment.append(form); }
else fragment.append(root);
if (!child) {
  const secret = document.createElement('input'); secret.type = 'password'; secret.value = 'PRIVATE-NATIVE-DELTA-CANARY'; secret.setAttribute('aria-label', 'Password'); fragment.append(secret);
}
content.append(fragment);
if (framed && !child) {
  const frame = document.createElement('iframe'); frame.src = `/?sequence=${sequence}&child=1`; content.append(frame);
}
window.deltaReady = true;
window.deltaAdvance = step => {
  const documents = [document, ...Array.from(document.querySelectorAll('iframe'), frame => frame.contentDocument)];
  const entries = documents.flatMap(doc => Array.from(doc.querySelectorAll('[data-entry]'))).sort((a,b)=>Number(a.dataset.entry)-Number(b.dataset.entry));
  const chosen = step % 5 === 0 ? [1, entries.length-1] : [(sequence * 7 + step * 11) % entries.length];
  for (const index of chosen) {
    const entry = entries[index], input = entry.querySelector('input');
    if (input.type === 'checkbox') input.checked = !input.checked;
    else input.value = `revision ${step} 🦀 ${index}`;
  }
  return {rows:entries.length, changed_records:chosen.length};
};
</script>
