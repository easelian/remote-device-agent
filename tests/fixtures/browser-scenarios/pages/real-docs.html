<!doctype html><meta charset=utf-8><title>A page of documentation</title>
<!-- Found on mui.com, getbootstrap.com and the-internet. The main part can be given the focus by a
     script and takes no clicks; a sentence is written in pieces; highlighted code is tens of
     thousands of nodes; the same control is shown again under every heading. -->
<a href=#main>Skip to content</a>
<nav id=nav></nav>
<main id=main tabindex=-1>
<h1>Select</h1>
<div id=chosen></div><button id=pick type=button>Pick</button>
<p>If closed, it will not appear on subsequent page loads.</p>
<!-- A slider as MUI draws it: the input that holds the value is clipped away inside the thumb. -->
<span style="position:relative;display:inline-block;width:200px;height:4px;padding:13px 0">
<span style="position:absolute;width:100%;height:4px;background:#ccc"></span>
<span id=thumb style="position:absolute;left:30%;width:20px;height:20px;border-radius:50%;background:#06c;transform:translate(-50%,-8px)">
<input id=volume type=range min=0 max=100 value=30 aria-label=Volume style="border:0;clip:rect(0 0 0 0);height:100%;margin:-1px;overflow:hidden;padding:0;position:absolute;white-space:nowrap;width:100%;direction:ltr">
</span></span> <output id=vol>Volume is 30</output>
<pre id=code></pre>
<h2><a href=#basic>Basic select</a></h2>
<div role=combobox tabindex=0 aria-expanded=false aria-label=Age onclick="this.setAttribute('aria-expanded','true')">Ten</div>
<h2><a href=#variants>Variants</a></h2>
<div role=combobox tabindex=0 aria-expanded=false aria-label=Age>Ten</div>
<div role=combobox tabindex=0 aria-expanded=false aria-label=Age>Ten</div>
<h2>Example</h2><h3><button type=button>Item #2</button></h3>
<h2>Flush</h2><h3><button type=button>Item #2</button></h3>
<!-- An option named by another element, as Radix names its options, far down a long page. -->
<div role=option tabindex=0 aria-labelledby=mango-name onclick="document.getElementById('mango-said').textContent='Took the mango'"><span id=mango-name>Mango</span></div>
<p id=mango-said></p>
<a href=/drip/plain.html>Slow page</a>
</main>
<script>
document.getElementById('nav').innerHTML=Array.from({length:300},(_,i)=>'<a href=#n'+i+'>Chapter '+i+'</a>').join(' ');
document.getElementById('code').innerHTML=Array.from({length:30000},(_,i)=>'<span>tok'+i+'</span>').join(' ');
document.getElementById('volume').addEventListener('input',e=>{document.getElementById('vol').textContent='Volume is '+e.target.value;document.getElementById('thumb').style.left=e.target.value+'%';});
const chosen=document.getElementById('chosen');chosen.append('Selected: ','user02');
document.getElementById('pick').onclick=()=>{chosen.lastChild.nodeValue='username';};
</script>
