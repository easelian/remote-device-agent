<!doctype html><meta charset=utf-8><title>A page that never finishes loading</title>
<!-- Met on ant.design and mui.com: the document is there at once, and something on it, here a
     picture, keeps the page loading longer than a call may take. -->
<h1>Catalogue</h1>
<button type=button onclick="document.getElementById('said').textContent='Opened the catalogue'">Browse</button>
<p id=said></p>
<img alt="Banner" src=/slow/30000>
