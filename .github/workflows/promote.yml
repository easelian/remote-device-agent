name: Promote

# Moves a channel pointer (channels/<channel>.json) to a released version.
# Rollout is a data change: devices evaluate the percentage themselves, so a
# canary-to-stable promotion needs no new artifacts.
on:
  workflow_dispatch:
    inputs:
      channel:
        description: Channel to move
        required: true
        default: stable
        type: choice
        options: [stable, canary]
      version:
        description: Released version, for example 0.8.0
        required: true
      percent:
        description: Rollout percentage (0-100)
        required: true
        default: '100'
      min_from:
        description: Optional minimum version allowed to upgrade
        required: false

permissions:
  contents: write

concurrency:
  group: promote-${{ inputs.channel }}
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Resolve version
        id: meta
        run: |
          set -eu
          version="${{ inputs.version }}"
          version="${version#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Fetch the release checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          mkdir -p dist
          gh release download "v${{ steps.meta.outputs.version }}" \
            --pattern SHA256SUMS --dir dist --clobber

      - name: Write the channel index
        run: |
          set -euo pipefail
          args=(--channel "${{ inputs.channel }}"
                --version "${{ steps.meta.outputs.version }}"
                --base "https://github.com/${{ github.repository }}/releases/download/v${{ steps.meta.outputs.version }}"
                --percent "${{ inputs.percent }}"
                --from dist)
          if [ -n "${{ inputs.min_from }}" ]; then args+=(--min-from "${{ inputs.min_from }}"); fi
          node scripts/promote.mjs "${args[@]}"

      - name: Commit the index
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add channels
          if git diff --cached --quiet; then echo "index unchanged"; exit 0; fi
          git commit -m "channel: ${{ inputs.channel }} ${{ steps.meta.outputs.version }} at ${{ inputs.percent }}%"
          git push
