name: Publish Agent npm packages

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published GitHub Release tag, for example v1.0.0
        required: true
        type: string

permissions:
  contents: read
  id-token: write
  attestations: read

concurrency:
  group: agent-npm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - name: Download and verify the published npm tarballs
        env:
          GH_TOKEN: ${{ github.token }}
          RDH_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          [[ "$RDH_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]
          [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" == "$RDH_TAG" ]]
          version="${RDH_TAG#v}"
          state=$(gh release view "$RDH_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease,tagName)
          node -e 'const x=JSON.parse(process.argv[1]); const tag=process.argv[2]; if(x.isDraft || x.tagName!==tag || x.isPrerelease!==tag.includes("-")) process.exit(1)' "$state" "$RDH_TAG"
          directory="$RUNNER_TEMP/rdh-npm"
          mkdir "$directory"
          assets=$(node packaging/npm/publish.cjs list "$version")
          patterns=()
          while IFS= read -r asset; do patterns+=(--pattern "$asset"); done <<< "$assets"
          gh release download "$RDH_TAG" --repo "$GITHUB_REPOSITORY" --dir "$directory" --pattern SHA256SUMS "${patterns[@]}"
          commit=$(gh api "repos/$GITHUB_REPOSITORY/commits/$RDH_TAG" --jq .sha)
          [[ "$commit" =~ ^[0-9a-f]{40}$ && "$commit" == "$GITHUB_SHA" ]]
          cd "$directory"
          while IFS= read -r asset; do
            awk -v file="$asset" '$2 == file {print; count++} END {exit count != 1}' SHA256SUMS > "$asset.sha256"
            sha256sum --check --strict "$asset.sha256"
            gh attestation verify "$asset" --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" --source-ref "refs/tags/$RDH_TAG" --source-digest "$commit" --deny-self-hosted-runners
          done <<< "$assets"
          printf 'RDH_VERSION=%s\n' "$version" >> "$GITHUB_ENV"
      - name: Publish platform builds before the Agent launcher
        run: node packaging/npm/publish.cjs publish "$RDH_VERSION" "$RUNNER_TEMP/rdh-npm"
