name: Agent CI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ci.yml'
      - 'src/**'
      - 'test/**'
      - 'bin/**'
      - 'packaging/**'
      - 'vendor/**'
      - 'scripts/**'
      - '!scripts/legacy-*-interop.ts'
      - '!scripts/check-legacy-inspection.py'
      - 'package*.json'
      - 'tsconfig.json'
      - 'biome.json'
      - 'README.md'
  pull_request:
    paths:
      - '.github/workflows/ci.yml'
      - 'src/**'
      - 'test/**'
      - 'bin/**'
      - 'packaging/**'
      - 'vendor/**'
      - 'scripts/**'
      - '!scripts/legacy-*-interop.ts'
      - '!scripts/check-legacy-inspection.py'
      - 'package*.json'
      - 'tsconfig.json'
      - 'biome.json'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-native-validation-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  test-build-check:
    name: Test and package (${{ matrix.os }}, ${{ matrix.arch }})
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - os: ubuntu-latest
            arch: x64
          - os: ubuntu-24.04-arm
            arch: arm64
          - os: macos-latest
            arch: arm64
          - os: windows-latest
            arch: x64
          - os: windows-11-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: ${{ startsWith(matrix.os, 'windows-') && 'powershell' || 'bash' }}
    steps:
      - name: Preserve LF line endings on Windows
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          architecture: ${{ matrix.arch }}
          cache: npm
      - name: Verify native Node.js architecture
        shell: node {0}
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          const assert = require('node:assert/strict');
          console.log(`${process.platform}/${process.arch} Node.js ${process.version}`);
          assert.equal(process.arch, process.env.EXPECTED_ARCH);
          assert.equal(process.env.RUNNER_ARCH.toLowerCase(), process.env.EXPECTED_ARCH);
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run style:check
      - run: npm run typecheck
      - run: npm test
      - name: Check npm payload, offline install and CLI aliases
        run: npm run pack:check
      - name: Check real Agent operations, reconnect and resource cleanup
        if: runner.os != 'Windows'
        run: node scripts/check_stability.mjs --duration-seconds 30 --json > stability-quick.json
      - id: metadata
        shell: node {0}
        run: |
          const fs = require('node:fs');
          const { version } = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\n`);
      - run: node scripts/release.mjs build
      - run: node scripts/release.mjs check ".build/release/remote-device-hub-${{ steps.metadata.outputs.version }}.json"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: remote-device-hub-${{ steps.metadata.outputs.version }}-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            dist/remote-device-hub-${{ steps.metadata.outputs.version }}.tgz
            stability-quick.json
