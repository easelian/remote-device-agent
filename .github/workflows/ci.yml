name: Agent CI

on:
  push:
    branches: [main]
    paths:
      - Cargo.toml
      - Cargo.lock
      - 'crates/**'
      - 'xtask/**'
      - scripts/legacy-audit-interop.ts
      - scripts/legacy-file-info-interop.ts
      - scripts/legacy-hardening-interop.ts
      - scripts/legacy-lock-interop.ts
      - scripts/legacy-process-interop.ts
      - scripts/legacy-receipts-interop.ts
      - scripts/legacy-search-interop.ts
      - scripts/legacy-system-interop.ts
      - src/agent.ts
      - src/audit.ts
      - src/boundary.ts
      - src/casefold.ts
      - src/config.ts
      - src/file-params.ts
      - src/files.ts
      - src/filesystem.ts
      - src/hardening.ts
      - src/operation-receipts.ts
      - src/platform.ts
      - src/policy.ts
      - src/posix-fs.ts
      - src/process-environment.ts
      - src/processes.ts
      - src/profile-lock.ts
      - src/sandbox.ts
      - src/searches.ts
      - src/startup-native.ts
      - src/startup.ts
      - src/transport.ts
      - src/types.ts
      - 'vendor/ws/**'
      - package.json
      - package-lock.json
      - .github/workflows/ci.yml
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - 'crates/**'
      - 'xtask/**'
      - scripts/legacy-audit-interop.ts
      - scripts/legacy-file-info-interop.ts
      - scripts/legacy-hardening-interop.ts
      - scripts/legacy-lock-interop.ts
      - scripts/legacy-process-interop.ts
      - scripts/legacy-receipts-interop.ts
      - scripts/legacy-search-interop.ts
      - scripts/legacy-system-interop.ts
      - src/agent.ts
      - src/audit.ts
      - src/boundary.ts
      - src/casefold.ts
      - src/config.ts
      - src/file-params.ts
      - src/files.ts
      - src/filesystem.ts
      - src/hardening.ts
      - src/operation-receipts.ts
      - src/platform.ts
      - src/policy.ts
      - src/posix-fs.ts
      - src/process-environment.ts
      - src/processes.ts
      - src/profile-lock.ts
      - src/sandbox.ts
      - src/searches.ts
      - src/startup-native.ts
      - src/startup.ts
      - src/transport.ts
      - src/types.ts
      - 'vendor/ws/**'
      - package.json
      - package-lock.json
      - .github/workflows/ci.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-native-validation-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: false
  queue: max

jobs:
  native-target:
    name: Development checks (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    # ARM64's old PowerShell ACL calls take up to 60 s each. The real Node
    # task/service round trips add serial compositions of those calls; native
    # operation deadlines stay unchanged. The matrix still has one executor.
    timeout-minutes: ${{ matrix.target == 'aarch64-pc-windows-msvc' && 240 || 60 }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
    defaults:
      run:
        shell: bash
    steps:
      - name: Preserve LF line endings on Windows
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - name: Verify runner architecture
        env:
          RDH_TARGET: ${{ matrix.target }}
        run: |
          case "$RDH_TARGET:$RUNNER_ARCH" in
            x86_64-*:X64|aarch64-*:ARM64) ;;
            *) printf 'Runner architecture does not match %s (%s)\n' "$RDH_TARGET" "$RUNNER_ARCH" >&2; exit 1 ;;
          esac
      - name: Record Windows installation-parent diagnostics
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 2
        run: |
          $since = Get-Date
          ('RDH_COMMAND_DIAGNOSTIC_START=' + $since.ToUniversalTime().ToString('o')) | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          foreach ($path in @([System.IO.Path]::GetPathRoot($env:ProgramData), $env:ProgramData)) {
            $acl = Get-Acl -LiteralPath $path
            Write-Host ('Installer ancestor ' + $path + ': ' + $acl.Sddl)
          }
      - name: Install the pinned Rust toolchain and target
        env:
          RDH_TARGET: ${{ matrix.target }}
        run: |
          rustup toolchain install 1.93.0 --profile minimal --component rustfmt --component clippy --target "$RDH_TARGET"
          rustc +1.93.0 -vV
      - name: Install musl tools
        if: endsWith(matrix.target, '-linux-musl')
        env:
          RDH_TARGET: ${{ matrix.target }}
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          case "$RDH_TARGET" in
            x86_64-*)
              printf '%s\n' 'CC_x86_64_unknown_linux_musl=musl-gcc' 'CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc' >> "$GITHUB_ENV"
              ;;
            aarch64-*)
              printf '%s\n' 'CC_aarch64_unknown_linux_musl=musl-gcc' 'CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc' >> "$GITHUB_ENV"
              ;;
          esac
      - name: Check formatting
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: cargo +1.93.0 fmt --all -- --check
      - name: Check Windows default-feature safety gates
        if: runner.os == 'Windows'
        env:
          RDH_TARGET: ${{ matrix.target }}
        run: |
          cargo +1.93.0 test --release --locked -p rdh-agent --lib --target "$RDH_TARGET" windows_default_tests::
      - name: Check macOS default safety gates
        if: runner.os == 'macOS'
        env:
          RDH_TARGET: ${{ matrix.target }}
        run: |
          cargo +1.93.0 test --release --locked -p rdh-agent --lib --target "$RDH_TARGET" macos_default_tests::
      - name: Compile an independent native upgrade candidate
        env:
          RDH_TARGET: ${{ matrix.target }}
          RUSTUP_TOOLCHAIN: 1.93.0
        run: |
          candidate="$RUNNER_TEMP/rdh-native-test-candidate"
          cargo +1.93.0 run --locked -p xtask -- native-test-candidate --target "$RDH_TARGET" --out "$candidate"
          printf 'RDH_NATIVE_TEST_CANDIDATE_DIR=%s\n' "$candidate" >> "$GITHUB_ENV"
      - name: Check implemented paths
        id: native_checks
        env:
          RDH_TARGET: ${{ matrix.target }}
        run: |
          cargo +1.93.0 clippy --locked --workspace --all-targets --all-features --target "$RDH_TARGET" -- -D warnings
      - name: Build and round-trip the native development archive
        id: native_artifacts
        env:
          RDH_TARGET: ${{ matrix.target }}
          RUSTUP_TOOLCHAIN: 1.93.0
        run: |
          artifacts="$RUNNER_TEMP/rdh-native-artifacts"
          cargo +1.93.0 run --locked -p xtask -- native-development --target "$RDH_TARGET" --out "$artifacts" --all-features
          shopt -s nullglob
          extracted=("$artifacts"/verified/*)
          [[ ${#extracted[@]} -eq 1 && -d "${extracted[0]}" ]]
          artifact="$(cd "${extracted[0]}" && pwd -P)"
          if [[ "$RUNNER_OS" == Windows ]]; then artifact="$(cygpath -w "$artifact")"; fi
          printf 'RDH_NATIVE_ARTIFACT_DIR=%s\n' "$artifact" >> "$GITHUB_ENV"
      - name: Test implemented paths
        id: native_tests
        env:
          RDH_TARGET: ${{ matrix.target }}
        run: |
          cargo +1.93.0 test --release --locked --workspace --all-targets --all-features --no-fail-fast --target "$RDH_TARGET"
      - name: Record Windows process-denial events after the failed tests
        if: ${{ !cancelled() && steps.native_tests.outcome == 'failure' && runner.os == 'Windows' }}
        shell: pwsh
        timeout-minutes: 2
        run: |
          $since = [datetime]::Parse($env:RDH_COMMAND_DIAGNOSTIC_START).ToLocalTime()
          foreach ($log in @('Microsoft-Windows-Windows Defender/Operational', 'Microsoft-Windows-CodeIntegrity/Operational', 'Microsoft-Windows-AppLocker/EXE and DLL')) {
            try {
              $events = Get-WinEvent -FilterHashtable @{LogName=$log; StartTime=$since} -MaxEvents 30 -ErrorAction Stop
              foreach ($event in $events) {
                $message = $event.Message
                if ($message -match 'cmd\.exe|rdh_agent|rdh-process-|rdh-command-diagnostic') {
                  Write-Host ($log + ' event ' + $event.Id + ' at ' + $event.TimeCreated.ToUniversalTime().ToString('o'))
                  Write-Host ($message.Substring(0, [Math]::Min($message.Length, 4096)))
                }
              }
            } catch {
              Write-Host ('Event diagnostic unavailable or empty for ' + $log + ': ' + $_.Exception.Message)
            }
          }
      - name: Check native LaunchAgent definition arguments
        if: ${{ !cancelled() && steps.native_checks.outcome == 'success' && (matrix.target == 'x86_64-unknown-linux-gnu' || runner.os == 'macOS') }}
        env:
          RDH_TARGET: ${{ matrix.target }}
        run: |
          python3 --version
          cargo +1.93.0 test --release --locked -p rdh-agent --lib --all-features --target "$RDH_TARGET" startup_native::macos::tests::launchagent_plist_executes_exact_native_arguments -- --ignored --test-threads=1
      - name: Check native LaunchAgent installed update and rollback
        if: ${{ !cancelled() && steps.native_artifacts.outcome == 'success' && runner.os == 'macOS' }}
        env:
          RDH_TARGET: ${{ matrix.target }}
        run: |
          cargo +1.93.0 test --release --locked -p rdh-agent --all-features --target "$RDH_TARGET" --test macos_launchd native_launchagent_runs -- --ignored --test-threads=1
      - name: Check native Windows service lifecycle
        if: ${{ !cancelled() && steps.native_artifacts.outcome == 'success' && runner.os == 'Windows' }}
        env:
          RDH_TARGET: ${{ matrix.target }}
        run: |
          cargo +1.93.0 test --release --locked -p rdh-agent --all-features --target "$RDH_TARGET" --test windows_service native_windows_ -- --ignored --test-threads=1
      - name: Check native POSIX system service installation and recovery
        if: ${{ !cancelled() && steps.native_artifacts.outcome == 'success' && runner.os != 'Windows' }}
        env:
          RDH_TARGET: ${{ matrix.target }}
        run: |
          cargo +1.93.0 test --release --locked -p rdh-agent --all-features --target "$RDH_TARGET" --test posix_system_service system_service_preserves_user_data -- --ignored --test-threads=1
      - name: Check native Windows startup settings and administrator grants
        if: ${{ !cancelled() && steps.native_checks.outcome == 'success' && runner.os == 'Windows' }}
        env:
          RDH_TARGET: ${{ matrix.target }}
        run: |
          cargo +1.93.0 test --release --locked -p rdh-agent --lib --all-features --target "$RDH_TARGET" native_windows_ -- --ignored --test-threads=1
      - name: Check native Windows installed task update and rollback
        if: ${{ !cancelled() && steps.native_artifacts.outcome == 'success' && runner.os == 'Windows' }}
        env:
          RDH_TARGET: ${{ matrix.target }}
        run: |
          cargo +1.93.0 test --release --locked -p rdh-agent --all-features --target "$RDH_TARGET" --test windows_native_install managed_windows_task_targets -- --ignored --test-threads=1
      - name: Set up Node for legacy comparison fixtures
        if: ${{ !cancelled() && steps.native_artifacts.outcome == 'success' }}
        uses: actions/setup-node@v7
        with:
          node-version: '22.22.0'
          architecture: ${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}
          package-manager-cache: false
      - name: Install legacy fixture build dependencies
        id: legacy_dependencies
        if: ${{ !cancelled() && steps.native_artifacts.outcome == 'success' }}
        run: |
          node -e 'const expected = process.env.RUNNER_ARCH === "ARM64" ? "arm64" : "x64"; if (process.arch !== expected) { throw new Error(`Node architecture ${process.arch} does not match ${expected}`); } console.log(process.version, process.arch);'
          npm ci --ignore-scripts
          mkdir -p .build
      - name: Build the legacy program for migration fixtures
        id: legacy_program
        if: ${{ !cancelled() && steps.legacy_dependencies.outcome == 'success' }}
        run: node scripts/build.mjs
      - name: Check legacy POSIX system service handoff and undo
        if: ${{ !cancelled() && steps.legacy_program.outcome == 'success' && runner.os != 'Windows' }}
        env:
          RDH_TARGET: ${{ matrix.target }}
        run: |
          export RDH_LEGACY_SOURCE="$PWD"
          export RDH_LEGACY_NODE="$(node -p 'process.execPath')"
          cargo +1.93.0 test --release --locked -p rdh-agent --all-features --target "$RDH_TARGET" --test posix_system_service legacy_system_service_handoff -- --ignored --test-threads=1
      - name: Check legacy macOS user LaunchAgent handoff and undo
        if: ${{ !cancelled() && steps.legacy_program.outcome == 'success' && runner.os == 'macOS' }}
        env:
          RDH_TARGET: ${{ matrix.target }}
        run: |
          export RDH_LEGACY_SOURCE="$PWD"
          export RDH_LEGACY_NODE="$(node -p 'process.execPath')"
          cargo +1.93.0 test --release --locked -p rdh-agent --all-features --target "$RDH_TARGET" --test macos_launchd legacy_launchagent_wrappers -- --ignored --test-threads=1
      - name: Check legacy Windows user task handoff and undo
        if: ${{ !cancelled() && steps.legacy_program.outcome == 'success' && runner.os == 'Windows' }}
        env:
          RDH_TARGET: ${{ matrix.target }}
        run: |
          export RDH_LEGACY_SOURCE="$(node -p 'process.cwd()')"
          export RDH_LEGACY_NODE="$(node -p 'process.execPath')"
          cargo +1.93.0 test --release --locked -p rdh-agent --all-features --target "$RDH_TARGET" --test windows_native_install legacy_windows_task_handoff -- --ignored --test-threads=1
      - name: Check out the old pinned Windows service host
        if: ${{ !cancelled() && steps.legacy_program.outcome == 'success' && runner.os == 'Windows' }}
        uses: actions/checkout@v7
        with:
          repository: mtkennerly/shawl
          ref: dbc4014c6d67027dc75a565d79fe9f493e897eb2 # v1.9.0, old release host
          path: .build/legacy-shawl-source
          persist-credentials: false
      - name: Build the old pinned Windows service host
        id: legacy_service_host
        if: ${{ !cancelled() && steps.legacy_program.outcome == 'success' && runner.os == 'Windows' }}
        env:
          RDH_TARGET: ${{ matrix.target }}
          RUSTFLAGS: -C target-feature=+crt-static
        run: |
          export CARGO_TARGET_DIR="$RUNNER_TEMP/rdh-legacy-shawl-target"
          cargo +1.93.0 build --locked --release --target "$RDH_TARGET" --manifest-path .build/legacy-shawl-source/Cargo.toml
      - name: Check legacy Windows LocalService handoff and undo
        if: ${{ !cancelled() && steps.legacy_service_host.outcome == 'success' && runner.os == 'Windows' }}
        env:
          RDH_TARGET: ${{ matrix.target }}
        run: |
          export RDH_LEGACY_SOURCE="$(node -p 'process.cwd()')"
          export RDH_LEGACY_NODE="$(node -p 'process.execPath')"
          export RDH_LEGACY_SHAWL="$(cygpath -w "$RUNNER_TEMP/rdh-legacy-shawl-target/$RDH_TARGET/release/shawl.exe")"
          cargo +1.93.0 test --release --locked -p rdh-agent --all-features --target "$RDH_TARGET" --test windows_service legacy_windows_service_handoff -- --ignored --test-threads=1
      - name: Compare legacy system hostname and release
        if: matrix.target == 'x86_64-unknown-linux-gnu' || runner.os == 'Windows' || runner.os == 'macOS'
        env:
          RDH_TARGET: ${{ matrix.target }}
        run: |
          node node_modules/esbuild/bin/esbuild scripts/legacy-system-interop.ts --bundle --platform=node --format=esm --target=node22 --outfile=.build/legacy-system-interop.mjs
          export RDH_LEGACY_SYSTEM_HELPER="$(node -p 'require("node:path").resolve(".build/legacy-system-interop.mjs")')"
          cargo +1.93.0 test --release --locked -p rdh-agent --all-features --target "$RDH_TARGET" --test legacy_system_interop -- --ignored --test-threads=1
      - name: Build the legacy lock fixture
        if: matrix.target == 'x86_64-unknown-linux-gnu' || runner.os == 'Windows' || runner.os == 'macOS'
        run: |
          node node_modules/esbuild/bin/esbuild scripts/legacy-lock-interop.ts --bundle --platform=node --format=esm --target=node22 --outfile=.build/legacy-lock-interop.mjs
          node -e 'const fs = require("node:fs"); const path = require("node:path"); fs.appendFileSync(process.env.GITHUB_ENV, `RDH_LEGACY_LOCK_HELPER=${path.resolve(".build/legacy-lock-interop.mjs")}\n`);'
      - name: Test legacy and Rust lock interoperability
        if: matrix.target == 'x86_64-unknown-linux-gnu' || runner.os == 'Windows' || runner.os == 'macOS'
        env:
          RDH_TARGET: ${{ matrix.target }}
        run: |
          cargo +1.93.0 test --release --locked -p rdh-agent --all-features --target "$RDH_TARGET" --test legacy_lock_interop -- --ignored --test-threads=1
      - name: Build and test the legacy file metadata fixture
        if: matrix.target == 'x86_64-unknown-linux-gnu' || runner.os == 'macOS' || runner.os == 'Windows'
        env:
          RDH_TARGET: ${{ matrix.target }}
        run: |
          node node_modules/esbuild/bin/esbuild scripts/legacy-file-info-interop.ts --bundle --platform=node --format=esm --target=node22 --outfile=.build/legacy-file-info-interop.mjs
          export RDH_LEGACY_FILE_HELPER="$(node -p 'require("node:path").resolve(".build/legacy-file-info-interop.mjs")')"
          cargo +1.93.0 test --release --locked -p rdh-agent --all-features --target "$RDH_TARGET" --test legacy_file_info_interop -- --ignored --test-threads=1
      - name: Build and test the legacy background search fixture
        if: matrix.target == 'x86_64-unknown-linux-gnu' || runner.os == 'macOS' || runner.os == 'Windows'
        env:
          RDH_TARGET: ${{ matrix.target }}
        run: |
          node node_modules/esbuild/bin/esbuild scripts/legacy-search-interop.ts --bundle --platform=node --format=esm --target=node22 --outfile=.build/legacy-search-interop.mjs
          export RDH_LEGACY_SEARCH_HELPER="$(node -p 'require("node:path").resolve(".build/legacy-search-interop.mjs")')"
          cargo +1.93.0 test --release --locked -p rdh-agent --all-features --target "$RDH_TARGET" --test legacy_search_interop -- --ignored --test-threads=1
      - name: Build and test the legacy process fixture
        if: matrix.target == 'x86_64-unknown-linux-gnu' || runner.os == 'macOS' || runner.os == 'Windows'
        env:
          RDH_TARGET: ${{ matrix.target }}
        run: |
          node node_modules/esbuild/bin/esbuild scripts/legacy-process-interop.ts --bundle --platform=node --format=esm --target=node22 --outfile=.build/legacy-process-interop.mjs
          export RDH_LEGACY_PROCESS_HELPER="$(node -p 'require("node:path").resolve(".build/legacy-process-interop.mjs")')"
          cargo +1.93.0 test --release --locked -p rdh-agent --all-features --target "$RDH_TARGET" --test legacy_process_interop -- --ignored --test-threads=1
      - name: Compare the legacy hardening report
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        env:
          RDH_TARGET: ${{ matrix.target }}
        run: |
          node node_modules/esbuild/bin/esbuild scripts/legacy-hardening-interop.ts --bundle --platform=node --format=esm --target=node22 --banner:js="import { createRequire } from 'node:module'; const require = createRequire(import.meta.url);" --outfile=.build/legacy-hardening-interop.mjs
          export RDH_LEGACY_HARDENING_HELPER="$PWD/.build/legacy-hardening-interop.mjs"
          cargo +1.93.0 test --release --locked -p rdh-agent --all-features --target "$RDH_TARGET" --test legacy_hardening_interop -- --ignored --test-threads=1
      - name: Test legacy audit handoff
        if: matrix.target == 'x86_64-unknown-linux-gnu' || runner.os == 'macOS' || runner.os == 'Windows'
        env:
          RDH_TARGET: ${{ matrix.target }}
        run: |
          node node_modules/esbuild/bin/esbuild scripts/legacy-audit-interop.ts --bundle --platform=node --format=esm --target=node22 --outfile=.build/legacy-audit-interop.mjs
          export RDH_LEGACY_AUDIT_HELPER="$(node -p 'require("node:path").resolve(".build/legacy-audit-interop.mjs")')"
          cargo +1.93.0 test --release --locked -p rdh-agent --all-features --target "$RDH_TARGET" --test legacy_audit_interop -- --ignored --test-threads=1
      - name: Compare legacy operation receipts
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        env:
          RDH_TARGET: ${{ matrix.target }}
        run: |
          node node_modules/esbuild/bin/esbuild scripts/legacy-receipts-interop.ts --bundle --platform=node --format=esm --target=node22 --outfile=.build/legacy-receipts-interop.mjs
          export RDH_LEGACY_RECEIPTS_HELPER="$PWD/.build/legacy-receipts-interop.mjs"
          cargo +1.93.0 test --release --locked -p rdh-agent --all-features --target "$RDH_TARGET" --test legacy_receipts_interop -- --ignored --test-threads=1
      - name: Build and inspect the development executable
        env:
          RDH_TARGET: ${{ matrix.target }}
        run: |
          cargo +1.93.0 build --locked --release -p rdh-agent --target "$RDH_TARGET"
          binary="target/$RDH_TARGET/release/rdh"
          if [[ "$RUNNER_OS" == Windows ]]; then binary="$binary.exe"; fi
          "$binary" --version
      - name: Retain native development artifacts
        if: ${{ !cancelled() && steps.native_artifacts.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: native-development-${{ matrix.target }}
          path: ${{ runner.temp }}/rdh-native-artifacts/rdh-*
          if-no-files-found: error
          retention-days: 7
