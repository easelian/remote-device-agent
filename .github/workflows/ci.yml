name: Agent CI

on:
  push:
    branches: [main]
    paths:
      - Cargo.toml
      - Cargo.lock
      - 'src/**'
      - 'tests/**'
      - 'xtask/**'
      - 'packaging/**'
      - '.github/scripts/**'
      - .github/workflows/ci.yml
      - .github/workflows/release.yml
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - 'src/**'
      - 'tests/**'
      - 'xtask/**'
      - 'packaging/**'
      - '.github/scripts/**'
      - .github/workflows/ci.yml
      - .github/workflows/release.yml
  workflow_dispatch:
  workflow_call:
    inputs:
      release_candidate:
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: agent-native-validation-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  plan:
    name: Avoid duplicate release checks
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
      actions: read
    outputs:
      native_required: ${{ steps.plan.outputs.native_required }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check whether this exact commit is already being validated for release
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(cargo metadata --locked --no-deps --format-version 1 | node -p "JSON.parse(require('fs').readFileSync(0)).packages.find(p => p.name === 'rdh-agent').version")
          node .github/scripts/ci-plan.cjs "v$version"

  native-target:
    name: Development checks (${{ matrix.target }})
    needs: plan
    if: needs.plan.outputs.native_required == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.target == 'aarch64-pc-windows-msvc' && 90 || 60 }}
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include:
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
    defaults:
      run:
        shell: bash
    env:
      RUSTUP_TOOLCHAIN: 1.93.0
    steps:
      - name: Preserve LF line endings on Windows
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify runner architecture
        env:
          RDH_TARGET: ${{ matrix.target }}
        run: |
          case "$RDH_TARGET:$RUNNER_ARCH" in
            x86_64-*:X64|aarch64-*:ARM64) ;;
            *) printf 'Runner architecture does not match %s (%s)\n' "$RDH_TARGET" "$RUNNER_ARCH" >&2; exit 1 ;;
          esac
      - name: Record Windows installation-parent diagnostics
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 2
        run: |
          $since = Get-Date
          ('RDH_COMMAND_DIAGNOSTIC_START=' + $since.ToUniversalTime().ToString('o')) | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          foreach ($path in @([System.IO.Path]::GetPathRoot($env:ProgramData), $env:ProgramData)) {
            $acl = Get-Acl -LiteralPath $path
            Write-Host ('Installer ancestor ' + $path + ': ' + $acl.Sddl)
          }
      - name: Install the pinned Rust toolchain and target
        env:
          RDH_TARGET: ${{ matrix.target }}
        run: |
          rustup toolchain install 1.93.0 --profile minimal --component rustfmt --component clippy --target "$RDH_TARGET"
          rustc +1.93.0 -vV
      - name: Install musl tools
        if: endsWith(matrix.target, '-linux-musl')
        env:
          RDH_TARGET: ${{ matrix.target }}
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          case "$RDH_TARGET" in
            x86_64-*)
              printf '%s\n' 'CC_x86_64_unknown_linux_musl=musl-gcc' 'CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc' >> "$GITHUB_ENV"
              ;;
            aarch64-*)
              printf '%s\n' 'CC_aarch64_unknown_linux_musl=musl-gcc' 'CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc' >> "$GITHUB_ENV"
              ;;
          esac
      - name: Check formatting
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: cargo +1.93.0 fmt --all -- --check
      - name: Restore Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: native-${{ matrix.runner }}-${{ matrix.target }}
          cache-bin: false
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install shell startup test tools
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh fish
      - name: Check npm platform selection and release assembly
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: node --test packaging/npm/launcher.test.cjs packaging/prepare-release.test.cjs .github/scripts/ci-plan.test.cjs
      - name: Check Windows explicitly disabled features
        if: runner.os == 'Windows'
        env:
          RDH_TARGET: ${{ matrix.target }}
        run: |
          cargo +1.93.0 test --profile ci --locked -p rdh-agent --lib --no-default-features --target "$RDH_TARGET" windows_default_tests::
      - name: Check macOS explicitly disabled features
        if: runner.os == 'macOS'
        env:
          RDH_TARGET: ${{ matrix.target }}
        run: |
          cargo +1.93.0 test --profile ci --locked -p rdh-agent --lib --no-default-features --target "$RDH_TARGET" macos_default_tests::
      - name: Check implemented paths
        id: native_checks
        env:
          RDH_TARGET: ${{ matrix.target }}
        run: |
          cargo +1.93.0 clippy --locked --workspace --all-targets --all-features --target "$RDH_TARGET" -- -D warnings
      - name: Create a local candidate tag for pull request validation
        if: github.event_name == 'pull_request'
        run: |
          version=$(cargo +1.93.0 metadata --locked --no-deps --format-version 1 | node -p "JSON.parse(require('fs').readFileSync(0)).packages.find(p => p.name === 'rdh-agent').version")
          git tag -f "v$version" "$GITHUB_SHA"
      - name: Build and round-trip the native archive
        id: native_artifacts
        env:
          RDH_TARGET: ${{ matrix.target }}
          RUSTUP_TOOLCHAIN: 1.93.0
          RDH_CANDIDATE: ${{ inputs.release_candidate || github.event_name == 'pull_request' }}
        run: |
          artifacts="$RUNNER_TEMP/rdh-native-artifacts"
          mode=native-development
          if [[ "$RDH_CANDIDATE" == true ]]; then mode=native-release-candidate; fi
          cargo +1.93.0 run --locked -p xtask -- "$mode" --target "$RDH_TARGET" --out "$artifacts" --all-features
          shopt -s nullglob
          extracted=("$artifacts"/verified/*)
          [[ ${#extracted[@]} -eq 1 && -d "${extracted[0]}" ]]
          artifact="$(cd "${extracted[0]}" && pwd -P)"
          if [[ "$RUNNER_OS" == Windows ]]; then artifact="$(cygpath -w "$artifact")"; fi
          printf 'RDH_NATIVE_ARTIFACT_DIR=%s\n' "$artifact" >> "$GITHUB_ENV"
      - name: Test implemented paths
        id: native_tests
        env:
          RDH_TARGET: ${{ matrix.target }}
        run: |
          cargo +1.93.0 test --profile ci --locked --workspace --all-targets --all-features --no-fail-fast --target "$RDH_TARGET"
      - name: Exercise npm launcher with the native executable
        if: ${{ !endsWith(matrix.target, '-linux-musl') }}
        env:
          RDH_TARGET: ${{ matrix.target }}
        run: |
          artifacts="$RUNNER_TEMP/rdh-native-artifacts"
          tree=("$artifacts"/verified/*)
          node -e 'const f=require("fs"); const path=require("path"); const m=JSON.parse(f.readFileSync(path.join(process.argv[1],"manifest.json"))); const out=process.argv[2]; f.mkdirSync(path.join(out,"native",m.platform),{recursive:true}); f.copyFileSync(path.join(process.argv[1],m.binary.path),path.join(out,"native",m.platform,m.binary.path)); if(process.platform!=="win32") f.chmodSync(path.join(out,"native",m.platform,m.binary.path),0o755);' "${tree[0]}" "$RUNNER_TEMP/rdh-npm-smoke"
          cp packaging/npm/rdh.cjs "$RUNNER_TEMP/rdh-npm-smoke/rdh.cjs"
          node "$RUNNER_TEMP/rdh-npm-smoke/rdh.cjs" --version | grep -Fx "$(cargo +1.93.0 metadata --locked --no-deps --format-version 1 | node -p "JSON.parse(require('fs').readFileSync(0)).packages.find(p => p.name === 'rdh-agent').version")"
      - name: Check repeated Windows binding lifecycle
        if: ${{ !cancelled() && steps.native_artifacts.outcome == 'success' && runner.os == 'Windows' }}
        env:
          RDH_TARGET: ${{ matrix.target }}
        run: |
          for attempt in {1..10}; do
            printf 'Windows binding lifecycle attempt %s/10\n' "$attempt"
            cargo +1.93.0 test --profile ci --locked -p rdh-agent --all-features --target "$RDH_TARGET" --test windows_pairing native_windows_cli_pairs_and_reuses_private_identity_without_node -- --exact --nocapture
          done
      - name: Record Windows process-denial events after the failed tests
        if: ${{ !cancelled() && steps.native_tests.outcome == 'failure' && runner.os == 'Windows' }}
        shell: pwsh
        timeout-minutes: 2
        run: |
          $since = [datetime]::Parse($env:RDH_COMMAND_DIAGNOSTIC_START).ToLocalTime()
          foreach ($log in @('Microsoft-Windows-Windows Defender/Operational', 'Microsoft-Windows-CodeIntegrity/Operational', 'Microsoft-Windows-AppLocker/EXE and DLL')) {
            try {
              $events = Get-WinEvent -FilterHashtable @{LogName=$log; StartTime=$since} -MaxEvents 30 -ErrorAction Stop
              foreach ($event in $events) {
                $message = $event.Message
                if ($message -match 'cmd\.exe|rdh_agent|rdh-process-|rdh-command-diagnostic') {
                  Write-Host ($log + ' event ' + $event.Id + ' at ' + $event.TimeCreated.ToUniversalTime().ToString('o'))
                  Write-Host ($message.Substring(0, [Math]::Min($message.Length, 4096)))
                }
              }
            } catch {
              Write-Host ('Event diagnostic unavailable or empty for ' + $log + ': ' + $_.Exception.Message)
            }
          }
      - name: Check native LaunchAgent definition arguments
        if: ${{ !cancelled() && steps.native_checks.outcome == 'success' && runner.os == 'macOS' }}
        env:
          RDH_TARGET: ${{ matrix.target }}
        run: |
          cargo +1.93.0 test --profile ci --locked -p rdh-agent --lib --all-features --target "$RDH_TARGET" startup::macos::tests::launchagent_plist_executes_exact_native_arguments -- --ignored --test-threads=1
      - name: Check native Windows startup settings and administrator grants
        if: ${{ !cancelled() && steps.native_checks.outcome == 'success' && runner.os == 'Windows' }}
        env:
          RDH_TARGET: ${{ matrix.target }}
        run: |
          cargo +1.93.0 test --profile ci --locked -p rdh-agent --lib --all-features --target "$RDH_TARGET" native_windows_ -- --ignored --test-threads=1
      - name: Build and inspect the development executable
        env:
          RDH_TARGET: ${{ matrix.target }}
        run: |
          cargo +1.93.0 build --locked --release -p rdh-agent --target "$RDH_TARGET"
          binary="target/$RDH_TARGET/release/rdh"
          if [[ "$RUNNER_OS" == Windows ]]; then binary="$binary.exe"; fi
          "$binary" --version
      - name: Check native Windows installer PATH persistence
        if: ${{ !cancelled() && steps.native_artifacts.outcome == 'success' && runner.os == 'Windows' }}
        env:
          RDH_TARGET: ${{ matrix.target }}
        run: |
          cargo +1.93.0 test --profile ci --locked -p rdh-agent --all-features --target "$RDH_TARGET" --test native_bootstrap native_windows_bootstrap_ -- --ignored --test-threads=1
      - name: Retain native development artifacts
        if: ${{ !cancelled() && steps.native_artifacts.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: native-development-${{ matrix.target }}
          path: ${{ runner.temp }}/rdh-native-artifacts/
          if-no-files-found: error
          retention-days: 7

  assemble-candidate:
    if: github.event_name == 'pull_request'
    needs: native-target
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/download-artifact@v8
        with:
          pattern: native-development-*
          path: ${{ runner.temp }}/native-inputs
      - name: Assemble and install the exact candidate npm package
        run: |
          version=$(cargo metadata --locked --no-deps --format-version 1 | node -p "JSON.parse(require('fs').readFileSync(0)).packages.find(p => p.name === 'rdh-agent').version")
          node packaging/prepare-release.cjs "$RUNNER_TEMP/native-inputs" "$RUNNER_TEMP/rdh-assembled" "$version" "$GITHUB_SHA" "$GITHUB_REPOSITORY"
          mkdir "$RUNNER_TEMP/npm-smoke"
          printf '{"private":true}\n' > "$RUNNER_TEMP/npm-smoke/package.json"
          npm install --prefix "$RUNNER_TEMP/npm-smoke" --ignore-scripts --no-audit --no-fund "$RUNNER_TEMP/rdh-assembled/easelian-remote-device-agent-$version.tgz"
          "$RUNNER_TEMP/npm-smoke/node_modules/.bin/rdh" --version | grep -Fx "$version"
      - name: Retain checked release candidates
        uses: actions/upload-artifact@v7
        with:
          name: release-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/rdh-assembled/
          if-no-files-found: error
          retention-days: 7
