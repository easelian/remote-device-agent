name: Agent CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-native-validation-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  scope-update:
    name: Scope update only (no acceptance tests)
    runs-on: ubuntu-24.04
    steps:
      - name: Record the narrowed validation scope
        run: printf '%s\n' 'Legacy Node migration is out of scope. This run cancels obsolete validation; it is not acceptance evidence. Native Rust validation follows after source cleanup.'
