name: Stop superseded Rust validation snapshot

on:
  pull_request:
    paths: ['.github/workflows/rust-ci-control.yml']

permissions:
  contents: read
  actions: write

jobs:
  stop-old-snapshot:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'codex/rust-agent-native-port-20261028'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Cancel only the superseded development snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.error, urllib.parse, urllib.request
          repository = os.environ['GITHUB_REPOSITORY']
          assert repository == 'easelian/remote-device-agent'
          branch = 'codex/rust-agent-native-port-20261028'
          snapshot = '77a010828f7634bd9fc1073b9834c5d422d37309'
          base = 'https://api.github.com/repos/' + repository
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                     'Accept': 'application/vnd.github+json',
                     'X-GitHub-Api-Version': '2022-11-28'}
          def call(path, method='GET'):
              request = urllib.request.Request(base + path, headers=headers, method=method,
                                               data=b'' if method == 'POST' else None)
              with urllib.request.urlopen(request, timeout=20) as response:
                  data = response.read()
                  return json.loads(data) if data else None
          runs = call('/actions/runs?' + urllib.parse.urlencode({'branch': branch, 'per_page': 100}))
          targets = [run for run in runs['workflow_runs']
                     if run['head_sha'] == snapshot and run['head_branch'] == branch
                     and run['name'] in ('Agent CI', 'Release', 'Rust Agent development CI')
                     and run['status'] != 'completed']
          for run in targets:
              path = '/actions/runs/' + str(run['id'])
              current = call(path)
              assert current['head_sha'] == snapshot and current['head_branch'] == branch
              if current['status'] == 'completed':
                  continue
              try:
                  call(path + '/cancel', 'POST')
              except urllib.error.HTTPError as error:
                  if error.code != 409:
                      raise
                  current = call(path)
                  if current['status'] != 'completed':
                      call(path + '/force-cancel', 'POST')
              print('Cancellation requested:', run['id'], run['name'])
          pending = {run['id'] for run in targets}
          for _ in range(25):
              pending = {run_id for run_id in pending
                         if call('/actions/runs/' + str(run_id))['status'] != 'completed'}
              if not pending:
                  break
              time.sleep(2)
          if pending:
              raise RuntimeError('Cancellation still pending: ' + str(sorted(pending)))
          print('Superseded snapshot is terminal')
          PY
