name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - '.github/workflows/release.yml'
      - 'packaging/**'
      - 'scripts/**'
      - '!scripts/legacy-*-interop.ts'
      - '!scripts/check-legacy-inspection.py'
      - 'src/**'
      - 'bin/**'
      - 'package*.json'
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'packaging/**'
      - 'scripts/**'
      - '!scripts/legacy-*-interop.ts'
      - '!scripts/check-legacy-inspection.py'
      - 'src/**'
      - 'bin/**'
      - 'package*.json'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag (leave empty to validate this branch)
        required: false
      publish:
        description: Publish the specified existing tag after all checks pass
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: agent-native-validation-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  windows-service-host:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - os: windows-latest
            arch: x64
            target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            arch: arm64
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v7
        with:
          repository: mtkennerly/shawl
          ref: dbc4014c6d67027dc75a565d79fe9f493e897eb2 # v1.9.0
          persist-credentials: false
      - name: Build native Windows service host from locked upstream source
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: |
          rustup toolchain install stable --profile minimal
          if ($LASTEXITCODE) { throw 'Rust installation failed' }
          rustup target add ${{ matrix.target }} --toolchain stable
          if ($LASTEXITCODE) { throw 'Rust target installation failed' }
          cargo +stable build --locked --release --target ${{ matrix.target }}
          if ($LASTEXITCODE) { throw 'Service host build failed' }
          New-Item -ItemType Directory -Path output | Out-Null
          Copy-Item target/${{ matrix.target }}/release/shawl.exe output/
          Invoke-WebRequest -UseBasicParsing https://github.com/mtkennerly/shawl/releases/download/v1.9.0/shawl-v1.9.0-legal.zip -OutFile legal.zip
          if ((Get-FileHash legal.zip -Algorithm SHA256).Hash -ne 'a2a1743a64b79922062906eb32cdaf23db131769f8cabcc98e5d57bbf66eb0b0') { throw 'License checksum mismatch' }
          Expand-Archive legal.zip output
      - uses: actions/upload-artifact@v7
        with:
          name: service-host-${{ matrix.arch }}
          path: output/
          if-no-files-found: error
          retention-days: 7

  build:
    needs: windows-service-host
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      sha: ${{ steps.meta.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Resolve source and release version
        id: meta
        shell: node {0}
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
          REQUESTED_PUBLISH: ${{ inputs.publish }}
        run: |
          const fs = require('node:fs');
          const cp = require('node:child_process');
          const version = JSON.parse(fs.readFileSync('package.json')).version;
          const tag = process.env.REQUESTED_TAG || (process.env.GITHUB_REF_TYPE === 'tag' ? process.env.GITHUB_REF_NAME : '');
          const sha = cp.execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
          if (process.env.REQUESTED_PUBLISH === 'true' && !tag) throw new Error('Publishing requires an existing version tag');
          if (tag) {
            if (tag !== `v${version}`) throw new Error('Tag must match package.json');
            const tagged = cp.execFileSync('git', ['rev-parse', `refs/tags/${tag}^{commit}`], { encoding: 'utf8' }).trim();
            if (tagged !== sha) throw new Error('Checkout does not match the release tag');
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `tag=${tag}\nsha=${sha}\n`);
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run style:check
      - run: npm run typecheck
      - run: npm test
      - uses: actions/download-artifact@v8
        with:
          pattern: service-host-*
          path: service-hosts
      - name: Build all eight self-contained runtime archives
        run: bash packaging/build-runtime.sh
        env:
          RDH_SERVICE_HOSTS: ${{ github.workspace }}/service-hosts
      - name: Stage installers and verify manifest
        run: |
          cp packaging/install.sh packaging/install.ps1 dist/
          node scripts/check_runtime.mjs dist
          node scripts/promote.mjs --channel canary --version "$(node -p "require('./package.json').version")" --base "https://example.test" --from dist --out "$RUNNER_TEMP/channel-check.json"
      - uses: actions/upload-artifact@v7
        with:
          name: runtime-bundles
          path: dist/
          if-no-files-found: error
          retention-days: 7

  smoke:
    needs: build
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - os: ubuntu-latest
            arch: x64
            platform: linux-x64-gnu
          - os: ubuntu-24.04-arm
            arch: arm64
            platform: linux-arm64-gnu
          - os: macos-15-intel
            arch: x64
            platform: darwin-x64
          - os: macos-latest
            arch: arm64
            platform: darwin-arm64
          - os: windows-latest
            arch: x64
            platform: win32-x64
          - os: windows-11-arm
            arch: arm64
            platform: win32-arm64
    name: Runtime (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: ${{ startsWith(matrix.os, 'windows-') && 'powershell' || 'bash' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.build.outputs.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          architecture: ${{ matrix.arch }}
          package-manager-cache: false
      - uses: actions/download-artifact@v8
        with:
          name: runtime-bundles
          path: dist
      - name: Test native runtime and install without system Node.js
        run: node scripts/check_runtime.mjs dist ${{ matrix.platform }}
      - name: Verify POSIX temporary session, logon and boot service lifecycle
        if: runner.os != 'Windows'
        run: node scripts/check_posix_startup.mjs dist --system
      - name: Verify Windows logon task and boot service lifecycle
        if: runner.os == 'Windows'
        run: node scripts/check_windows_startup.mjs dist

  musl:
    needs: [build, smoke]
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64-musl
          - os: ubuntu-24.04-arm
            platform: linux-arm64-musl
    name: Runtime (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: runtime-bundles
          path: dist
      - name: Execute the bundled runtime in native Alpine
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          docker run --rm -e PLATFORM -v "$PWD/dist:/dist:ro" alpine:3.22 sh -ec '
            apk add --no-cache libstdc++ libgcc
            archive=$(find /dist -name "rdh-*-$PLATFORM.tar.gz")
            test -n "$archive"
            cd /dist && sha256sum -c SHA256SUMS
            mkdir /runtime
            tar -xzf "$archive" -C /runtime --strip-components=1
            expected=$(/runtime/node -p "require(\"/runtime/package.json\").version")
            test "$(PATH= /runtime/rdh --version)" = "$expected"
            sh /dist/install.sh --offline "$archive" --prefix /installed --bin-dir /commands --no-pair --no-service
            test "$(/commands/rdh --version)" = "$expected"
          '

  publish:
    needs: [build, smoke, musl]
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: runtime-bundles
          path: dist
      - name: Publish verified runtime archives
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
        run: |
          set -euo pipefail
          assets=(dist/rdh-*.tar.gz dist/rdh-*.zip dist/SHA256SUMS dist/rdh-manifest.json dist/install.sh dist/install.ps1)
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          else
            flags=()
            case "$RELEASE_TAG" in *-*) flags+=(--prerelease) ;; esac
            gh release create "$RELEASE_TAG" "${assets[@]}" --verify-tag --title "Remote Device Hub Agent $RELEASE_TAG" --generate-notes "${flags[@]}"
          fi
